name: Deploy TajwidLens Next.js

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          node -e "
            const value = process.env.NEXT_PUBLIC_API_URL;
            if (!value) throw new Error('NEXT_PUBLIC_API_URL is missing');
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.pathname !== '/' || url.search || url.hash)
              throw new Error('NEXT_PUBLIC_API_URL must be an HTTPS origin');
            console.log('API URL configuration is valid');
          "

      - name: Build Next.js
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_REPO_NAME: ${{ vars.NEXT_PUBLIC_REPO_NAME || github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ vars.NEXT_PUBLIC_REPO_NAME || github.event.repository.name }}

      - name: Verify build output
        run: |
          test -f out/index.html
          ls -lah out

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
