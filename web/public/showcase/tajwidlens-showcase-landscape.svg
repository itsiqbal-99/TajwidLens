<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TajwidLens promotional showcase for desktop</title>
  <desc id="desc">Poster promosi TajwidLens dengan tampilan laptop dan ponsel, hukum tajwid per ayat, modul belajar visual, tiga tema, dan PWA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162d38"/><stop offset=".62" stop-color="#274554"/><stop offset="1" stop-color="#b66f63"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf3f6"/><stop offset="1" stop-color="#f9edeb"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#071820" flood-opacity=".32"/></filter>
    <pattern id="grain" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grain)"/>
  <circle cx="1475" cy="74" r="220" fill="#d7ae72" opacity=".12"/><circle cx="1420" cy="820" r="310" fill="#df968b" opacity=".11"/>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(70 58)"><rect width="42" height="42" rx="10" fill="#f7fafb"/><path d="M10 12c5-2 9-1.2 12.5 1.7C26 10.8 30 10 35 12v17c-5-2-9-1.3-12.5 1.7C19 27.7 15 27 10 29V12Z" fill="none" stroke="#2f4858" stroke-width="2"/><circle cx="29" cy="21" r="5" fill="#f7fafb" stroke="#c98779" stroke-width="2"/><path d="m33 25 3 3" stroke="#c98779" stroke-width="2" stroke-linecap="round"/><text x="56" y="29" fill="#fff" font-size="25" font-weight="760">Tajwid<tspan fill="#e5a99e">Lens</tspan></text></g>
    <g transform="translate(474 60)"><rect width="206" height="38" rx="19" fill="#fff" opacity=".12"/><circle cx="20" cy="19" r="5" fill="#d7ae72"/><text x="36" y="25" fill="#f7fafb" font-size="12" font-weight="700" letter-spacing="1">PWA · ANDROID &amp; iOS</text></g>
    <text x="70" y="208" fill="#fff" font-size="72" font-weight="780" letter-spacing="-3.5">Tajwid terlihat.</text>
    <text x="70" y="283" fill="#e5a99e" font-size="72" font-weight="780" letter-spacing="-3.5">Bacaan lebih yakin.</text>
    <text x="73" y="337" fill="#d9e5e9" font-size="20">Pendamping Al-Qur'an visual yang menjelaskan hukum bacaan</text><text x="73" y="367" fill="#d9e5e9" font-size="20">langsung dari setiap ayat—di desktop maupun ponsel.</text>
    <g transform="translate(70 421)">
      <g><rect width="286" height="102" rx="18" fill="#fff" opacity=".1"/><circle cx="31" cy="31" r="7" fill="#e5a99e"/><text x="50" y="36" fill="#fff" font-size="15" font-weight="720">Tajwid per ayat</text><text x="24" y="69" fill="#c9d9df" font-size="12">114 surah · 143.049 rentang</text><text x="24" y="87" fill="#c9d9df" font-size="12">dengan penjelasan kontekstual</text></g>
      <g transform="translate(304)"><rect width="286" height="102" rx="18" fill="#fff" opacity=".1"/><circle cx="31" cy="31" r="7" fill="#d7ae72"/><text x="50" y="36" fill="#fff" font-size="15" font-weight="720">Belajar lebih visual</text><text x="24" y="69" fill="#c9d9df" font-size="12">24 modul dengan ilustrasi,</text><text x="24" y="87" fill="#c9d9df" font-size="12">contoh ayat, dan cara membaca</text></g>
      <g transform="translate(0 120)"><rect width="286" height="102" rx="18" fill="#fff" opacity=".1"/><circle cx="31" cy="31" r="7" fill="#8ec7b0"/><text x="50" y="36" fill="#fff" font-size="15" font-weight="720">Tiga suasana warna</text><text x="24" y="69" fill="#c9d9df" font-size="12">Samudra · Zamrud · Senja</text><text x="24" y="87" fill="#c9d9df" font-size="12">tersimpan otomatis di perangkat</text></g>
      <g transform="translate(304 120)"><rect width="286" height="102" rx="18" fill="#fff" opacity=".1"/><circle cx="31" cy="31" r="7" fill="#b8a5ce"/><text x="50" y="36" fill="#fff" font-size="15" font-weight="720">Pasang seperti aplikasi</text><text x="24" y="69" fill="#c9d9df" font-size="12">Akses cepat dan pengalaman</text><text x="24" y="87" fill="#c9d9df" font-size="12">standalone di Android &amp; iOS</text></g>
    </g>
    <g transform="translate(70 705)"><rect width="278" height="62" rx="12" fill="#f7fafb"/><text x="25" y="39" fill="#243746" font-size="17" font-weight="760">Mulai dari satu ayat</text><path d="M237 31h16m-7-7 7 7-7 7" fill="none" stroke="#c98779" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="70" y="835" fill="#bcd0d8" font-size="11" font-weight="700" letter-spacing="2.5">UNDERSTAND EVERY RULE · READ WITH CONFIDENCE</text>
  </g>
