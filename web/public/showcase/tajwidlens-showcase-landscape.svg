      <g transform="translate(38 38)" font-family="Inter,Arial,sans-serif"><rect width="674" height="42" rx="9" fill="#fff" opacity=".82"/><circle cx="18" cy="21" r="8" fill="#2f4858"/><text x="34" y="26" fill="#243746" font-size="12" font-weight="740">Tajwid<tspan fill="#c98779">Lens</tspan></text><text x="372" y="26" fill="#667680" font-size="9">Belajar Tajwid</text><text x="458" y="26" fill="#667680" font-size="9">Jelajahi Al-Qur'an</text><rect x="578" y="10" width="77" height="22" rx="5" fill="#2f4858"/><text x="592" y="25" fill="#fff" font-size="8" font-weight="700">Panduan Bacaan</text></g>
      <g transform="translate(48 100)" font-family="Inter,Arial,sans-serif"><text x="0" y="13" fill="#55758c" font-size="8" font-weight="760" letter-spacing="1.3">AL-FALAQ · AYAT 02</text><text x="0" y="46" fill="#243746" font-size="24" font-weight="750">Pahami bacaan langsung</text><text x="0" y="72" fill="#243746" font-size="24" font-weight="750">dari konteks ayat.</text><text x="0" y="101" fill="#667680" font-size="10">Ketuk warna untuk melihat hukum dan cara membacanya.</text></g>
      <g transform="translate(315 105)"><rect width="374" height="184" rx="18" fill="#fff" stroke="#d6e0e5"/><text x="187" y="75" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',serif" font-size="41" fill="#243746">مِن شَرِّ مَا خَلَقَ</text><rect x="54" y="105" width="266" height="12" rx="6" fill="#edf3f6"/><rect x="54" y="105" width="79" height="12" rx="6" fill="#c98779"/><rect x="154" y="105" width="93" height="12" rx="6" fill="#d7ae72"/><text x="54" y="147" fill="#995d52" font-family="Inter,Arial" font-size="10" font-weight="740">IKHFA HAQIQI</text><text x="151" y="147" fill="#667680" font-family="Inter,Arial" font-size="9">Samarkan nun dengan dengung 2 harakat</text></g>
      <g transform="translate(48 319)" font-family="Inter,Arial,sans-serif"><rect width="641" height="108" rx="16" fill="#fff" opacity=".76"/><g transform="translate(17 17)"><rect width="190" height="74" rx="12" fill="#f7e9e6"/><text x="15" y="23" fill="#995d52" font-size="7" font-weight="760" letter-spacing="1">MODUL VISUAL</text><text x="15" y="49" fill="#243746" font-size="15" font-weight="720">Nun sukun &amp; tanwin</text><path d="M137 53c15-26 34-26 45 0" fill="none" stroke="#c98779" stroke-width="2"/></g><g transform="translate(225 17)"><rect width="190" height="74" rx="12" fill="#f3ecd9"/><text x="15" y="23" fill="#8b6d37" font-size="7" font-weight="760" letter-spacing="1">CARA MEMBACA</text><text x="15" y="49" fill="#243746" font-size="15" font-weight="720">Panduan kontekstual</text><circle cx="161" cy="39" r="17" fill="none" stroke="#d7ae72" stroke-width="3"/></g><g transform="translate(433 17)"><rect width="190" height="74" rx="12" fill="#e7eef2"/><text x="15" y="23" fill="#55758c" font-size="7" font-weight="760" letter-spacing="1">PETA AYAT</text><text x="15" y="49" fill="#243746" font-size="15" font-weight="720">Rentang penuh warna</text><rect x="146" y="23" width="9" height="33" rx="4" fill="#55758c"/><rect x="161" y="12" width="9" height="55" rx="4" fill="#c98779"/></g></g>
      <path d="M-35 456h816l-39 40H4Z" fill="#dde5e8"/><rect x="328" y="466" width="90" height="7" rx="4" fill="#b3c1c7"/>
