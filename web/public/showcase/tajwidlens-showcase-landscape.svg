      <g font-family="Inter,Arial,sans-serif"><text x="28" y="70" fill="#243746" font-size="13" font-weight="760">Tajwid<tspan fill="#c98779">Lens</tspan></text><circle cx="218" cy="65" r="11" fill="#2f4858"/><text x="27" y="111" fill="#55758c" font-size="7" font-weight="760" letter-spacing="1.2">BACAAN HARI INI</text><text x="27" y="143" fill="#243746" font-size="23" font-weight="760">Al-Falaq</text><text x="27" y="162" fill="#667680" font-size="9">Ayat 02 · Hafs 'an 'Ashim</text></g>
      <rect x="22" y="184" width="208" height="174" rx="19" fill="#fff"/><text x="126" y="246" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',serif" font-size="31" fill="#243746">مِن شَرِّ</text><rect x="48" y="273" width="156" height="10" rx="5" fill="#edf3f6"/><rect x="48" y="273" width="63" height="10" rx="5" fill="#c98779"/><g font-family="Inter,Arial,sans-serif"><text x="43" y="319" fill="#995d52" font-size="8" font-weight="760">IKHFA HAQIQI</text><text x="43" y="338" fill="#667680" font-size="8">Dengungkan sekitar 2 harakat</text><rect x="22" y="377" width="208" height="48" rx="13" fill="#2f4858"/><text x="43" y="407" fill="#fff" font-size="10" font-weight="720">Buka penjelasan lengkap</text><path d="M195 401h14m-6-6 6 6-6 6" fill="none" stroke="#d7ae72" stroke-width="2"/><text x="126" y="452" text-anchor="middle" fill="#667680" font-size="8">Terpasang · siap dibuka dari layar utama</text></g>
